---
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task -l

  install:
    desc: Install App
    cmds:
      - task: check
      - go install -ldflags "-s -w -X github.com/allaman/ghard/internal/version.Version=0.1.0" ./cmd/ghard/

  check:
    desc: Run various checks
    cmds:
      - task: fmt
      - task: test
      # - task: lint
      - task: vet
      - task: build

  build:
    desc: Build App
    cmds:
      - go build -o ghard ./cmd/ghard/

  run:
    desc: Run App
    cmds:
      - go build -o ghard ./cmd/ghard/ && ./ghard

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Run formatter
    cmds:
      - go fmt ./...

  upgrade-deps:
    desc: Upgrade all dependencies
    cmds:
      - go get -u ./...

  test:
    desc: Run go test
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  vuln:
    desc: Check for vulnerabilities
    cmds:
      - govulncheck ./...

  flake-lock:
    desc: Generate/update flake.lock via a Nix Docker container
    cmds:
      - |
        docker run --rm \
          -v "{{.ROOT_DIR}}:/work" \
          -w /work \
          nixos/nix \
          sh -c "nix --extra-experimental-features 'nix-command flakes' flake lock"

  flake-vendor-hash:
    desc: Compute the correct vendorHash and patch it into flake.nix via Docker
    cmds:
      - |
        echo "Running nix build to determine correct vendorHash..."
        HASH=$(docker run --rm \
          -v "{{.ROOT_DIR}}:/work" \
          -w /work \
          nixos/nix \
          sh -c "nix --extra-experimental-features 'nix-command flakes' build 2>&1; true" \
          | grep -E '^\s+got:' | awk '{print $NF}')
        if [ -z "$HASH" ]; then
          echo "ERROR: could not extract vendorHash — build may have failed for an unrelated reason."
          exit 1
        fi
        echo "Patching flake.nix with vendorHash: $HASH"
        sed -i '' "s|vendorHash = \".*\";|vendorHash = \"$HASH\";|" "{{.ROOT_DIR}}/flake.nix"
